[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quallki-agentic"
version = "0.1.0"
description = "LangGraph starter project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.30",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
