[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quallki-agentic"
version = "0.1.0"
description = "LangGraph starter project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.30",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-google-genai>=2.1.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.2",
  "redis>=5.2.0",
  "joblib>=1.4.2",
  "numpy>=1.26.0",
  "lightgbm>=4.6.0",
  "torch>=2.2.0",
  "pennylane>=0.39.0",
  "streamlit>=1.38.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
